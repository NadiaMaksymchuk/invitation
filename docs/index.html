<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Валентин & Надія — запрошення</title>
  <meta name="description" content="Запрошуємо на святкування розпису 14.11.26">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <!-- Positions and sizes are copied from the Canva design (396.85 × 559.37). -->
    <article class="card">
      <svg class="rings" viewBox="0 0 60 44" aria-hidden="true">
        <circle cx="23" cy="28" r="12" />
        <circle cx="37" cy="28" r="12" />
        <path d="M18 14 l5 -6 l5 6 l-5 4 z M18 14 h10" />
      </svg>

      <p class="monogram">n &amp; v</p>
      <h1 class="names">Валентин &amp; Надія</h1>
      <p class="invite">запрошуємо на святкування<br>розпису</p>

      <p class="day">14</p>
      <i class="sep sep--1"></i>
      <p class="month">11</p>
      <i class="sep sep--2"></i>
      <p class="year">26</p>

      <p class="place">“Гостинний двір”,<br>Проектна, 3-а, Чернівці</p>
      <p class="time">16:00</p>
      <p class="hope">Ми сподіваємося розділити цю<br>радість з Вами ❤️</p>
    </article>

    <section class="question" id="question">
      <p class="ask">Ви прийдете?</p>
      <div class="buttons">
        <button class="btn btn--yes" id="yes" type="button">Так</button>
        <button class="btn btn--no" id="no" type="button">Ні</button>
      </div>
    </section>

    <section class="answer" id="answer" hidden>
      <p class="ask">Ура! Чекаємо на Вас ❤️</p>
      <p class="later">До зустрічі 14 листопада о 16:00</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
